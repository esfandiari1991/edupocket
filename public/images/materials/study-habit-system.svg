<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">EduPocket study habit system</title>
  <desc id="desc">A visual checklist for building a repeatable study habit: cue, tiny action, measure, and review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071522"/>
      <stop offset="1" stop-color="#040914"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" rx="34" fill="url(#bg)"/>
  <text x="74" y="92" fill="#fff" font-family="Manrope, Inter, Arial, sans-serif" font-size="44" font-weight="800">Build a Study Habit</text>
  <text x="74" y="132" fill="#9fb0c4" font-family="Manrope, Inter, Arial, sans-serif" font-size="22">A habit is easier to repeat when it is visible, small, and measured.</text>
  <g transform="translate(74 206)">
    <rect width="1132" height="360" rx="26" fill="#0d1a2a" stroke="#26384f"/>
    <g font-family="Manrope, Inter, Arial, sans-serif">
      <g transform="translate(54 58)">
        <rect width="220" height="220" rx="20" fill="#101f31" stroke="#31425a"/>
        <circle cx="54" cy="58" r="26" fill="#fbbf24"/>
        <text x="54" y="67" text-anchor="middle" fill="#05111e" font-size="28" font-weight="900">1</text>
        <text x="34" y="124" fill="#fff" font-size="28" font-weight="800">Cue</text>
        <text x="34" y="164" fill="#b8c5d7" font-size="18">After morning tea</text>
        <text x="34" y="192" fill="#b8c5d7" font-size="18">or opening laptop.</text>
      </g>
      <g transform="translate(324 58)">
        <rect width="220" height="220" rx="20" fill="#101f31" stroke="#31425a"/>
        <circle cx="54" cy="58" r="26" fill="#fbbf24"/>
        <text x="54" y="67" text-anchor="middle" fill="#05111e" font-size="28" font-weight="900">2</text>
        <text x="34" y="124" fill="#fff" font-size="28" font-weight="800">Tiny action</text>
        <text x="34" y="164" fill="#b8c5d7" font-size="18">Review 5 cards or</text>
        <text x="34" y="192" fill="#b8c5d7" font-size="18">record 60 seconds.</text>
      </g>
      <g transform="translate(594 58)">
        <rect width="220" height="220" rx="20" fill="#101f31" stroke="#31425a"/>
        <circle cx="54" cy="58" r="26" fill="#fbbf24"/>
        <text x="54" y="67" text-anchor="middle" fill="#05111e" font-size="28" font-weight="900">3</text>
        <text x="34" y="124" fill="#fff" font-size="28" font-weight="800">Measure</text>
        <text x="34" y="164" fill="#b8c5d7" font-size="18">Track the proof,</text>
        <text x="34" y="192" fill="#b8c5d7" font-size="18">not the feeling.</text>
      </g>
      <g transform="translate(864 58)">
        <rect width="220" height="220" rx="20" fill="#101f31" stroke="#31425a"/>
        <circle cx="54" cy="58" r="26" fill="#fbbf24"/>
        <text x="54" y="67" text-anchor="middle" fill="#05111e" font-size="28" font-weight="900">4</text>
        <text x="34" y="124" fill="#fff" font-size="28" font-weight="800">Review</text>
        <text x="34" y="164" fill="#b8c5d7" font-size="18">Repeat after 1, 3,</text>
        <text x="34" y="192" fill="#b8c5d7" font-size="18">7, and 14 days.</text>
      </g>
    </g>
  </g>
  <rect x="210" y="617" width="860" height="18" rx="9" fill="#122237"/>
  <rect x="210" y="617" width="602" height="18" rx="9" fill="url(#bar)"/>
  <text x="640" y="666" text-anchor="middle" fill="#dbeafe" font-family="Manrope, Inter, Arial, sans-serif" font-size="22" font-weight="700">Small enough to repeat. Specific enough to improve.</text>
</svg>
