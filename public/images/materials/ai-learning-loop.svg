<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">EduPocket AI learning loop</title>
  <desc id="desc">A four step visual system for using AI as a learning partner: map, practice, feedback, and error log.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="0.55" stop-color="#0b2033"/>
      <stop offset="1" stop-color="#050b16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000814" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="1280" height="720" rx="34" fill="url(#bg)"/>
  <circle cx="1066" cy="126" r="190" fill="#38bdf8" opacity="0.08"/>
  <circle cx="210" cy="610" r="230" fill="#fbbf24" opacity="0.08"/>
  <text x="70" y="92" fill="#f8fafc" font-family="Manrope, Inter, Arial, sans-serif" font-size="44" font-weight="800">AI Learning Loop</text>
  <text x="70" y="132" fill="#9fb0c4" font-family="Manrope, Inter, Arial, sans-serif" font-size="22">Use AI to think, practice, reflect, and repeat.</text>
  <text x="1210" y="92" text-anchor="end" fill="#fbbf24" font-family="Manrope, Inter, Arial, sans-serif" font-size="24" font-weight="800">EduPocket</text>
  <g filter="url(#shadow)">
    <rect x="90" y="230" width="230" height="220" rx="22" fill="#0f1d2d" stroke="#26384f"/>
    <rect x="370" y="230" width="230" height="220" rx="22" fill="#0f1d2d" stroke="#26384f"/>
    <rect x="650" y="230" width="230" height="220" rx="22" fill="#0f1d2d" stroke="#26384f"/>
    <rect x="930" y="230" width="230" height="220" rx="22" fill="#0f1d2d" stroke="#26384f"/>
  </g>
  <g font-family="Manrope, Inter, Arial, sans-serif">
    <g transform="translate(90 230)">
      <circle cx="54" cy="54" r="26" fill="#fbbf24"/>
      <text x="54" y="63" text-anchor="middle" fill="#06111f" font-size="28" font-weight="900">1</text>
      <text x="32" y="114" fill="#ffffff" font-size="27" font-weight="800">Map</text>
      <text x="32" y="154" fill="#b8c5d7" font-size="18">Ask for the structure,</text>
      <text x="32" y="181" fill="#b8c5d7" font-size="18">not the final answer.</text>
    </g>
    <g transform="translate(370 230)">
      <circle cx="54" cy="54" r="26" fill="#fbbf24"/>
      <text x="54" y="63" text-anchor="middle" fill="#06111f" font-size="28" font-weight="900">2</text>
      <text x="32" y="114" fill="#ffffff" font-size="27" font-weight="800">Practice</text>
      <text x="32" y="154" fill="#b8c5d7" font-size="18">Answer first. Let AI</text>
      <text x="32" y="181" fill="#b8c5d7" font-size="18">wait before feedback.</text>
    </g>
    <g transform="translate(650 230)">
      <circle cx="54" cy="54" r="26" fill="#fbbf24"/>
      <text x="54" y="63" text-anchor="middle" fill="#06111f" font-size="28" font-weight="900">3</text>
      <text x="32" y="114" fill="#ffffff" font-size="27" font-weight="800">Feedback</text>
      <text x="32" y="154" fill="#b8c5d7" font-size="18">Ask what worked and</text>
      <text x="32" y="181" fill="#b8c5d7" font-size="18">what needs review.</text>
    </g>
    <g transform="translate(930 230)">
      <circle cx="54" cy="54" r="26" fill="#fbbf24"/>
      <text x="54" y="63" text-anchor="middle" fill="#06111f" font-size="28" font-weight="900">4</text>
      <text x="32" y="114" fill="#ffffff" font-size="27" font-weight="800">Error log</text>
      <text x="32" y="154" fill="#b8c5d7" font-size="18">Turn mistakes into</text>
      <text x="32" y="181" fill="#b8c5d7" font-size="18">the next mini-lesson.</text>
    </g>
  </g>
  <path d="M322 340h42M602 340h42M882 340h42" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
  <path d="m354 323 18 17-18 17M634 323l18 17-18 17M914 323l18 17-18 17" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="260" y="548" width="760" height="74" rx="18" fill="#020817" stroke="#1f334a"/>
  <text x="640" y="594" text-anchor="middle" fill="#dbeafe" font-family="Manrope, Inter, Arial, sans-serif" font-size="24" font-weight="700">Rule: AI should reduce friction, not remove thinking.</text>
</svg>
