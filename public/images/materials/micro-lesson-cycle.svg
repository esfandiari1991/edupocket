<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Micro-lesson cycle</title>
  <desc id="desc">A five-part micro-lesson system: target, model, notice, practice, feedback.</desc>
  <rect width="1280" height="720" rx="34" fill="#06111f"/>
  <text x="74" y="92" fill="#fff" font-family="Manrope, Inter, Arial, sans-serif" font-size="44" font-weight="800">Micro-Lesson Cycle</text>
  <text x="74" y="132" fill="#9fb0c4" font-family="Manrope, Inter, Arial, sans-serif" font-size="22">One clear target. One complete learning loop.</text>
  <g transform="translate(640 378)" font-family="Manrope, Inter, Arial, sans-serif">
    <circle r="190" fill="#0d1a2a" stroke="#26384f" stroke-width="2"/>
    <circle r="92" fill="#101f31" stroke="#fbbf24" stroke-width="2"/>
    <text y="-8" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">12 minutes</text>
    <text y="28" text-anchor="middle" fill="#b8c5d7" font-size="18">focused learning</text>
    <g fill="#fbbf24" font-weight="900" font-size="20">
      <text x="-18" y="-244">1</text>
      <text x="202" y="-78">2</text>
      <text x="122" y="202">3</text>
      <text x="-156" y="202">4</text>
      <text x="-238" y="-78">5</text>
    </g>
    <g fill="#fff" font-size="24" font-weight="800">
      <text x="-64" y="-244">Target</text>
      <text x="224" y="-78">Model</text>
      <text x="140" y="202">Notice</text>
      <text x="-254" y="202">Practice</text>
      <text x="-342" y="-78">Feedback</text>
    </g>
  </g>
  <path d="M640 142a236 236 0 0 1 225 164M865 306a236 236 0 0 1-88 278M777 584a236 236 0 0 1-278 0M499 584a236 236 0 0 1-88-278M411 306a236 236 0 0 1 225-164" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  <text x="640" y="664" text-anchor="middle" fill="#e0f2fe" font-family="Manrope, Inter, Arial, sans-serif" font-size="22" font-weight="700">Small lesson does not mean small ambition.</text>
</svg>
