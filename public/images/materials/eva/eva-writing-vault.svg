<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Eva Writing Vault</title>
  <desc id="desc">A visual model for draft, feedback, revision, and portfolio evidence.</desc>
  <rect width="1280" height="720" rx="36" fill="#050b16"/>
  <radialGradient id="gold" cx="50%" cy="50%" r="65%">
    <stop offset="0%" stop-color="#fde68a" stop-opacity=".34"/>
    <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
  </radialGradient>
  <circle cx="1028" cy="160" r="260" fill="url(#gold)"/>
  <g font-family="Manrope, Inter, Arial, sans-serif">
    <text x="86" y="104" fill="#ffffff" font-size="48" font-weight="850">Writing Vault</text>
    <text x="88" y="146" fill="#9fb0c4" font-size="22">Every serious draft should leave a trace.</text>
    <g transform="translate(102 216)">
      <rect width="420" height="360" rx="26" fill="#0d1726" stroke="#26384f"/>
      <rect x="36" y="46" width="348" height="44" rx="12" fill="#111f32" stroke="#2b405a"/>
      <rect x="36" y="116" width="298" height="18" rx="9" fill="#e2e8f0" opacity=".88"/>
      <rect x="36" y="156" width="330" height="18" rx="9" fill="#94a3b8" opacity=".62"/>
      <rect x="36" y="196" width="252" height="18" rx="9" fill="#94a3b8" opacity=".42"/>
      <rect x="36" y="258" width="160" height="46" rx="14" fill="#fbbf24"/>
      <text x="70" y="288" fill="#0f172a" font-size="18" font-weight="850">SAVE DRAFT</text>
    </g>
    <g transform="translate(594 178)">
      <rect width="214" height="124" rx="20" fill="#fbbf24" opacity=".14" stroke="#facc15"/>
      <text x="26" y="48" fill="#fde68a" font-size="18" font-weight="800">Teacher note</text>
      <text x="26" y="80" fill="#ffffff" font-size="22" font-weight="800">Name action</text>
    </g>
    <g transform="translate(594 336)">
      <rect width="214" height="124" rx="20" fill="#38bdf8" opacity=".12" stroke="#7dd3fc"/>
      <text x="26" y="48" fill="#bae6fd" font-size="18" font-weight="800">Revision</text>
      <text x="26" y="80" fill="#ffffff" font-size="22" font-weight="800">Improve proof</text>
    </g>
    <g transform="translate(870 238)">
      <rect width="300" height="256" rx="26" fill="#0d1726" stroke="#26384f"/>
      <text x="34" y="60" fill="#fbbf24" font-size="20" font-weight="800">PORTFOLIO</text>
      <text x="34" y="108" fill="#ffffff" font-size="32" font-weight="850">Ready evidence</text>
      <text x="34" y="154" fill="#b8c5d7" font-size="18">Draft, feedback,</text>
      <text x="34" y="184" fill="#b8c5d7" font-size="18">revision, and next</text>
      <text x="34" y="214" fill="#b8c5d7" font-size="18">review stay together.</text>
    </g>
    <path d="M528 394 H586" stroke="#fde68a" stroke-width="5" stroke-linecap="round"/>
    <path d="M812 398 H862" stroke="#fde68a" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
